name: Refresh municipal evidence candidate

on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

concurrency:
  group: municipal-evidence-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run data:refresh
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: municipal-evidence-candidate
          path: src/lib/municipal-snapshot.json
          retention-days: 30
          if-no-files-found: error

  publish:
    needs: refresh
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Retrieve validated evidence artifact
        uses: actions/download-artifact@v8
        with:
          name: municipal-evidence-candidate
          path: .
      - name: Propose source changes for editorial review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- src/lib/municipal-snapshot.json; then
            echo 'No evidence change.'
            exit 0
          fi
          branch="automation/municipal-evidence-$(date -u +%Y-%m-%d)"
          if git ls-remote --heads origin "refs/heads/$branch" | grep -q .; then
            echo 'A review branch already exists today; not overwriting it.'
            exit 0
          fi
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/municipal-snapshot.json
          git commit -m 'data: propose refreshed municipal evidence'
          gh auth setup-git
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --base "$GITHUB_REF_NAME" --head "$branch" --title 'Review refreshed municipal evidence' --body 'Automated public-source candidate. Validate publication dates, geographic scope, attribution and practical claims before merging. Collector tests, type checking and build passed. This PR does not publish directly.'
