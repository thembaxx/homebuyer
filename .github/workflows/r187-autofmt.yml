name: Temporary r187 formatting repair
on:
  push:
    branches: ["feat/three-r187-home-lighting"]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - run: npx oxfmt --write src/components/house-scene.tsx
      - name: Commit formatter-only change
        run: |
          if git diff --quiet -- src/components/house-scene.tsx; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/components/house-scene.tsx
          git commit -m "style(3d): apply project Oxfmt formatting"
          git push origin "HEAD:feat/three-r187-home-lighting"
