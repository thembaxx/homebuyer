name: One-time r187 format remediation
on:
  push:
    branches:
      - fix/r187-postmerge-format
permissions:
  contents: write
jobs:
  apply-formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format only files flagged by CI
        run: |
          ./node_modules/.bin/oxfmt --write ".github/workflows/r187-home-browser.yml" ".github/workflows/threejs-r187-qa.yml" "public/vision/app.js" "public/vision/index.html" "public/vision/model-worker.js" "public/vision/style.css" "public/vision/sw.js" "src/app/layout.tsx"
          echo "Formatted workflow YAML diffs (for separately permissioned review):"
          git diff -- ".github/workflows/r187-home-browser.yml" ".github/workflows/threejs-r187-qa.yml"
          git add -- "public/vision/app.js" "public/vision/index.html" "public/vision/model-worker.js" "public/vision/style.css" "public/vision/sw.js" "src/app/layout.tsx"
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "style: apply Oxfmt to existing CI drift"
            git push origin HEAD:fix/r187-postmerge-format
          fi
